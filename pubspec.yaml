name: protrack
description: A project tracking application for managing instruments, projects, tasks, and activities.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  json_annotation: ^4.8.1
  uuid: ^4.0.0
  provider: ^6.0.5
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  amplify_flutter: ^1.6.1
  amplify_auth_cognito: ^1.6.1
  flutter_secure_storage: ^9.0.0
  google_sign_in: ^6.1.5
  sign_in_with_apple: ^5.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.7.1
  image_picker: ^1.0.7
  intl: ^0.20.2
  pdf: ^3.10.7
  path_provider: ^2.1.2
  open_file: ^3.3.2
  permission_handler: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/login_bg.png
    - assets/amplifyconfiguration.json
    - assets/images/protrack_logo.png
